<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>بوت صنع شخصية وفلوس</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-box {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
    }

    #messages {
      min-height: 200px;
      margin-bottom: 20px;
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 300px;
    }

    button {
      padding: 10px 20px;
      margin: 5px 2px;
      background-color: #0a84ff;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    input {
      padding: 10px;
      width: calc(100% - 90px);
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      display: inline-block;
    }

    .input-group {
      display: flex;
      align-items: center;
    }

    .code-box {
      background: #333;
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
      direction: ltr;
      text-align: left;
      overflow-x: auto;
    }

    #note {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="chat-box">
    <div id="messages"></div>
    <div id="buttons">
      <button id="startBtn">ابدأ</button>
    </div>
  </div>

  <script>
    let attempts = 2;
    let state = null;
    let currentCode = "";

    const messages = document.getElementById("messages");
    const buttons = document.getElementById("buttons");

    function addMessage(text) {
      messages.innerHTML += text + "\n\n";
      messages.scrollTop = messages.scrollHeight;
    }

    function clearButtons() {
      buttons.innerHTML = '';
    }

    function createCharacterCode(name) {
      return JSON.stringify({
        version: 3,
        data: JSON.stringify({
          lastSaved: "2022-08-08T09:50:09.992174Z",
          patchVersion: 2,
          selected: { character: name, outfit: "default" },
          lastPermanentSelectedCharacter: { character: null, outfit: null },
          owned: {
            [name]: {
              value: {
                id: name,
                ownedOutfits: [
                  { value: "default", expirationType: 0 },
                  { value: "red", expirationType: 0 },
                  { value: "premium", expirationType: 0 }
                ],
                lastOutfit: "default"
              },
              expirationType: 0
            }
          }
        }, null, 2)
      }, null, 2);
    }

    function createMoneyCode(amount) {
      return JSON.stringify({
        version: 3,
        data: JSON.stringify({
          lastSaved: "2022-06-27T15:29:34.520972Z",
          patchVersion: 0,
          currencies: {
            "3": { value: amount, expirationType: 0 },
            "2": { value: amount, expirationType: 0 },
            "1": { value: amount, expirationType: 0 },
            "5": { value: amount, expirationType: 0 },
            "4": { value: amount, expirationType: 0 }
          },
          lootboxQueue: { unopenedLootboxes: [] },
          currencyAllowedInRun: { "4": true, "5": true },
          lootBoxesOpened: {
            mystery_box: 117,
            super_mystery_box: 34,
            token_box: 1,
            mini_mystery_box: 28
          },
          ownedOnlyBuyOnceProducts: [
            "tankbot_incaOutfit", "andy_gamerOutfit", "polar_bundle", "free_token_box",
            "multiplier_pack", "party_bundle", "chili_value_pack_01", "chili_value_pack_02",
            "chili_value_pack_03", "chili_value_pack_04", "chili_value_pack_05",
            "free_social_media_facebook", "free_social_media_twitter", "free_social_media_youtube",
            "free_social_media_instagram", "free_social_media_tiktok", "free_social_media_discord"
          ]
        }, null, 2)
      }, null, 2);
    }

    function showOptions() {
      clearButtons();
      addMessage("مرحبًا بك! اختر ما تريد:");
      const charBtn = document.createElement("button");
      charBtn.textContent = "🎭 صنع شخصية";
      charBtn.onclick = () => {
        if (attempts <= 0) return addMessage("❌ انتهت محاولاتك.");
        state = "character";
        askInput("📝 اكتب اسم الشخصية (بالإنجليزية فقط):");
      };

      const moneyBtn = document.createElement("button");
      moneyBtn.textContent = "💰 صنع فلوس";
      moneyBtn.onclick = () => {
        if (attempts <= 0) return addMessage("❌ انتهت محاولاتك.");
        state = "money";
        askInput("💵 اكتب عدد الفلوس (أرقام فقط):");
      };

      buttons.appendChild(charBtn);
      buttons.appendChild(moneyBtn);
    }

    function askInput(promptText) {
      clearButtons();
      addMessage(promptText);
      const group = document.createElement("div");
      group.className = "input-group";

      const input = document.createElement("input");
      input.placeholder = "اكتب هنا...";

      const sendBtn = document.createElement("button");
      sendBtn.textContent = "إرسال";
      sendBtn.onclick = () => handleInput(input.value.trim());

      group.appendChild(input);
      group.appendChild(sendBtn);
      buttons.appendChild(group);
      input.focus();
    }

    function handleInput(input) {
      if (state === "character") {
        const name = input.toLowerCase();
        if (!/^[a-z0-9_]+$/.test(name)) return addMessage("⚠ استخدم أحرف إنجليزية فقط");
        currentCode = createCharacterCode(name);
        displayCode();
        attempts--;
      } else if (state === "money") {
        if (!/^\d+$/.test(input)) return addMessage("❌ من فضلك أرسل رقم فقط.");
        currentCode = createMoneyCode(parseInt(input));
        displayCode();
        attempts--;
      }

      state = null;
      if (attempts > 0) showOptions();
    }

    function displayCode() {
      const codeBox = document.createElement("div");
      codeBox.className = "code-box";
      codeBox.textContent = currentCode;
      messages.appendChild(codeBox);

      const note = document.createElement("div");
      note.id = "note";
      note.textContent = "آسف، تم استخدام المحاولة";
      messages.appendChild(note);
      messages.scrollTop = messages.scrollHeight;

      // مراقبة التغيير في النص
      const observer = new MutationObserver(() => {
        copyToClipboard(currentCode);
        observer.disconnect(); // بعد النسخ مرة واحدة
      });

      observer.observe(note, { characterData: true, subtree: true, childList: true });
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("تم نسخ الكود تلقائيًا إلى الحافظة!");
      });
    }

    document.getElementById("startBtn").onclick = showOptions;
  </script>
</body>
  </html>
